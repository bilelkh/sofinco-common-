# ==========================================
# CHAMP MONTANT SIMULATEUR (mixin partagé sofmix:simulatorAmount)
# Bornes + messages d'erreur. Chaque champ laissé vide retombe sur sa cascade :
# bornes → configuration globale du simulateur ; messages → défaut du composant React.
# ==========================================
sofmix_simulatorAmount = Champ montant du simulateur
sofmix_simulatorAmount.amountPlaceholder = Label du champ de saisie
sofmix_simulatorAmount.amountPlaceholder.ui.tooltip = Texte affiché dans le champ tant qu'aucun montant n'est saisi. Si vide, valeur par défaut "J'ai besoin de".
sofmix_simulatorAmount.amountMin = Montant minimum
sofmix_simulatorAmount.amountMin.ui.tooltip = Surcharge le montant minimum pour ce composant. Si vide, valeur de la configuration globale du simulateur.
sofmix_simulatorAmount.amountMax = Montant maximum
sofmix_simulatorAmount.amountMax.ui.tooltip = Surcharge le montant maximum pour ce composant. Si vide, valeur de la configuration globale du simulateur. Plafonné à 999999 (6 chiffres) par le champ de saisie.
sofmix_simulatorAmount.requiredErrorMessage = Message si aucun montant n'est saisi
sofmix_simulatorAmount.requiredErrorMessage.ui.tooltip = Affiché à la validation quand le champ est vide. Si vide, valeur par défaut "Ce champ est requis".
sofmix_simulatorAmount.minErrorMessage = Message si le montant est inférieur au minimum
sofmix_simulatorAmount.minErrorMessage.ui.tooltip = Le jeton {min} est remplacé par le montant minimum. Si vide, valeur par défaut "Le montant minimum est de {min}€".
sofmix_simulatorAmount.maxErrorMessage = Message si le montant dépasse le maximum
sofmix_simulatorAmount.maxErrorMessage.ui.tooltip = Le jeton {max} est remplacé par le montant maximum. Si vide, valeur par défaut "Le montant maximum est de {max}€".
