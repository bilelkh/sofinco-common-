sofnt_structuredDataSettings.ratingMinReviewCount.ui.tooltip = Nombre d'avis en dessous duquel la note n'est pas publiée : une moyenne assise sur trop peu d'avis n'est pas représentative.

sofmix_structuredDataOptions = Données structurées (SEO)
sofmix_structuredDataOptions.disableFaqSchema = Désactiver le balisage FAQ
sofmix_structuredDataOptions.disableFaqSchema.ui.tooltip = Le balisage FAQPage est actif par défaut sur les pages contenant de vraies questions/réponses. À désactiver si le contenu affiché ne correspond pas à une FAQ.
sofmix_structuredDataOptions.disableArticleSchema = Désactiver le balisage Article
sofmix_structuredDataOptions.disableVideoSchema = Désactiver le balisage Vidéo
sofmix_structuredDataOptions.enableAggregateRating = Publier la note client (Avis Vérifiés)
sofmix_structuredDataOptions.enableAggregateRating.ui.tooltip = Inactif par défaut, et à activer sur avis du référencement uniquement. Deux réserves à connaître : la note publiée est celle du SITE ENTIER, pas celle de cette page — l'activer sur une page produit ne dit rien de ce produit en particulier ; et Google ne produit d'extrait d'avis (les étoiles en résultat de recherche) pour AUCUN des types que ce site émet — le balisage est valide et lisible par les IA génératives, mais n'affichera pas d'étoiles. Sans effet si le bandeau d'avis du pied de page est désactivé pour tout le site. Les seuils de publication se règlent dans Données structurées (SEO) des paramètres du site.

