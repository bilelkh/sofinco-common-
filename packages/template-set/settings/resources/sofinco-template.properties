sofmix_loanProductSchema.loanTermMaxMonths = Durée maximale (mois)
sofmix_loanProductSchema.loanAprMin = TAEG minimum (%)
sofmix_loanProductSchema.loanAprMin.ui.tooltip = Séparateur décimal : le point. Les valeurs doivent correspondre aux mentions légales affichées sur la page.
sofmix_loanProductSchema.loanAprMax = TAEG maximum (%)

