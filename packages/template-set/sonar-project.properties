# SonarQube / SonarCloud — configuration statique du module template-set.
#
# L'URL du serveur et le token NE SONT PAS ici (secrets) — passe-les en variables
# d'environnement, lues automatiquement par le scanner :
#   SONAR_HOST_URL=https://ton-sonar-distant
#   SONAR_TOKEN=xxxxxxxx
# puis : yarn sonar   (chaîne coverage + scanner — voir package.json)

sonar.projectKey=sofinco-template-set
sonar.projectName=Sofinco template-set
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Serveur SonarQube auto-hébergé CA (PAS SonarCloud → aucune sonar.organization).
# À figer ici, sinon le wrapper npm retombe sur le défaut sonarcloud.io qui, lui,
# exige une organisation. Hostname interne = pas un secret.
sonar.host.url=https://sonar.ca-cf.gca

# Code analysé (bugs / vulnérabilités / smells) — on garde TOUT le src,
# y compris les *.server.tsx / *.client.tsx (analyse statique pertinente).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts

# Couverture produite par vitest (provider v8) — Sonar la lit, ne la calcule pas.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Hors analyse : généré / non source.
sonar.exclusions=dist/**,coverage/**,node_modules/**,**/*.d.ts

# Hors *dénominateur* de couverture (non testables en unitaire node) —
# reste analysé pour les bugs/smells, mais ne plombe pas le % de couverture.
# Doit rester aligné avec coverage.exclude de vitest.config.ts.
sonar.coverage.exclusions=src/**/*.server.tsx,src/**/*.client.tsx,src/**/*.types.ts,**/*.test.ts,src/test/**,src/**/*-bootstrap.ts,src/**/*-script.ts
