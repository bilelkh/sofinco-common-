# --- Politique de poids des images (types definis dans META-INF/definitions.cnd) ---
sofnt_imageWeightPolicy = Politique de poids des images
sofnt_imageWeightRule = Règle de poids d'image
sofnt_imageWeightRule.category = Catégorie d'image
