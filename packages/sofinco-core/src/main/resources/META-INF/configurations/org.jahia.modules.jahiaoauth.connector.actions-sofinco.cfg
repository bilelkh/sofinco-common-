# Factory config (PID org.jahia.modules.jahiaoauth.connector.actions) that makes jahia-oauth's
# configurable connect/callback actions available for this connector. No Java action classes needed.
#
# This produces:
#   .connectToSofincoAction.do        (from connectToActionName)
#   .sofincoOAuthCallbackAction.do    (from callbackActionName)
# The action names MUST match the URLs the button JSP calls and the callback URL configured on the IdP.
connectorName=SofincoApi
callbackActionName=sofincoOAuthCallbackAction
connectToActionName=connectToSofincoAction
# Adds a per-request nonce to the authorize request (recommended for OIDC).
randomNonceAdditionalParam=true
# Optional fixed extra authorize params (prefix additionalParams_):
# additionalParams_prompt=login
