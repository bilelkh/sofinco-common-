# default configuration
#
# ============================================================================
# Sofinco APIM Configuration - PID: ch.sofinco.core.apim
# ============================================================================
#
# Le marker "# default configuration" en première ligne empêche que les
# redéploiements du bundle écrasent les valeurs runtime modifiées par les
# ops via Provisioning API ou Tools Config Admin UI.
#
# Substitution Karaf : ${env:VAR:-fallback} lit la variable d'environnement
# VAR, fallback si absente.
#
# Architecture du flow (URL UNIFIÉE — confirmé support Sofinco juin 2026) :
#   1. POST {apimApiUrl}/token  avec Basic {apimClientKey}
#      → retourne un accessToken UUID
#   2. POST {apimApiUrl}/loanSimulation/v3/...  ou  /revolvingSimulation/v3/...
#      avec Bearer UUID + Origin/Referer
#      → retourne LoanCalculateResponse ou RevolvingCalculateResponse
#
# ============================================================================

# ----------------------------------------------------------------------------
# URL APIM (unique pour /token et endpoints métier)
# ----------------------------------------------------------------------------

# URL racine APIM pour TOUS les appels (/token, /loanSimulation/v3, /revolvingSimulation/v3)
# Recette:    https://rct-api.sofinco.fr
# Production: https://api.sofinco.fr
apimApiUrl=${env:SOFINCO_APIM_API_URL:-}

# ----------------------------------------------------------------------------
# Credentials et identité applicative
# ----------------------------------------------------------------------------

# Base64('consumer-key:consumer-secret') de l'application APIM 'clientKey'.
# C'est CELLE-CI qui marche pour les appels métier (validé par tests recette),
# PAS la 'serverKey' qui sert seulement au flow legacy /IDTokenGenerator.
# Lue depuis le filterre7.properties du bundle component-js-sofinco legacy.
apimClientKey=${env:SOFINCO_APIM_CLIENT_KEY:-}

# Identifiant partenaire pour le segment /partners/{partnerId}/ des endpoints v3
partnerId=${env:SOFINCO_APIM_PARTNER_ID:-web_sofinco}

# ----------------------------------------------------------------------------
# Origin / CORS
# ----------------------------------------------------------------------------
#
# Valeur du header HTTP Origin envoyé aux appels APIM publique.
#
# Ordre de priorité dans le code :
#   1. apimOrigin renseigné non-vide ICI       → utilisé (override ops)
#   2. sinon auto-détection depuis HttpServletRequest → utilisé (multi-host)
#   3. sinon pas de header Origin envoyé        → batch/preview
#
# Laisser VIDE par défaut pour bénéficier de l'auto-détection multi-host.
# Ne renseigner que si tu veux forcer une valeur précise (debug, contrainte).
#
# Exemples si forçage souhaité :
# Recette:    https://rct-contrib-v8.jahia.sofinco.ca-cf.gca
# Production: https://www.sofinco.fr
apimOrigin=${env:SOFINCO_APIM_ORIGIN:-}

# ----------------------------------------------------------------------------
# Timeouts HTTP
# ----------------------------------------------------------------------------

connectTimeoutSeconds=5
socketTimeoutSeconds=10
responseTimeoutSeconds=15

# ----------------------------------------------------------------------------
# Cache token
# ----------------------------------------------------------------------------

# Marge de sécurité avant l'expiration nominale pour déclencher un refresh.
# Le token sera considéré expiré 'tokenSafetyMarginSeconds' secondes avant
# sa vraie deadline, pour éviter d'envoyer une requête avec un token qui
# vient de péremer entre la lecture du cache et l'envoi à APIM.
tokenSafetyMarginSeconds=120

# Plafond max du cache token côté Java.
# Défense contre les valeurs absurdes d'expires_in observées en recette
# (notamment la sentinelle 9223372036854775 = Long.MAX_VALUE/1000 qui signifie
# "never expire" côté WSO2). Permet aussi de récupérer rapidement d'une
# rotation de clés côté APIM.
tokenMaxCacheSeconds=3600

# ----------------------------------------------------------------------------
# Mock mode
# ----------------------------------------------------------------------------

# Si true, le service retourne des données fixtures depuis les mocks JSON
# embarqués dans le bundle (src/main/resources/mocks/*.json).
# Utile en dev local sans VPN entreprise, ou pour les démos hors-ligne.
# IMPORTANT : forcer à false en intégration / recette / production.
mockMode=false
