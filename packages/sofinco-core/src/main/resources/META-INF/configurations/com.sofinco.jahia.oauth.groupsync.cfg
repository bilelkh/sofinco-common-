# OSGi Config Admin defaults for the Sofinco group-sync feature (PID = filename without .cfg).
# Jahia auto-installs files in META-INF/configurations into Config Admin. Edit on a running server
# (karaf/etc/com.sofinco.jahia.oauth.groupsync.cfg or config:edit) — @Modified reapplies live.
# Consumed by SofincoGroupConfig, shared by SofincoGroupSyncProcessor and SofincoGroupInstaller.

# Managed universe: a single comma-separated list of group names. The IdP "groups" claim value and
# the Jahia group name are IDENTICAL ("Nom du groupe" == "Nom commun"), so one list serves both sides.
# These are the ONLY groups the processor adds to / removes from, and the ones the installer provisions.
# (Backslash = line continuation; leading whitespace on continued lines is ignored.)
managedGroups=

# Userinfo claim that carries the user's group memberships.
groupsClaim=groups

# Group scope: blank = server-level (/groups). Set a site key for /sites/<key>/groups.
groupSiteKey=

# Auto-create missing managed groups on installer activation. false (default) = leave the repository
# untouched and expect groups to be provisioned out-of-band (e.g. import/repository.xml).
autoCreateGroups=false
