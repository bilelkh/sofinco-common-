# OSGi Config Admin defaults for the Sofinco custom login URL (PID = filename without .cfg).
# Jahia auto-installs files in META-INF/configurations into Config Admin. Edit on a running server
# (karaf/etc/com.sofinco.jahia.oauth.loginurl.cfg or config:edit) — @Modified reapplies live.
# Consumed by SofincoLoginUrlProvider: on an unauthorized (401) access Jahia redirects here.

# Master switch. false = this provider stays inert and 401s fall back to Jahia's default login.
enabled=true

# Site key whose SofincoApi connector config is read to build the DIRECT IdP authorize URL (the primary
# 401 path — needs no anonymous Jahia render, so it works even when the guest user is disabled).
siteKey=sofinco

# Authorize-request extras — MUST mirror actions-sofinco.cfg so the 401 flow builds the same authorize URL
# as jahia-oauth's login button. Sofinco's action has randomNonceAdditionalParam=true, so keep this true.
randomNonce=true
# Fixed extra authorize params as key=value (mirror any additionalParams_* in actions-sofinco.cfg). Repeat
# the key for multiple values. None configured for Sofinco (the action's additionalParams_* are commented out).
# additionalParams=prompt=login

# FALLBACK ONLY. Used when the direct IdP URL cannot be built (connector config or OAuth services
# unavailable). Site-relative render-action URL (SofincoConnectRedirectAction) that server-side 302s to the
# IdP. NOT jahia-oauth's popup/XHR ".connectToSofincoAction.do" (that returns JSON => blank page on a
# top-level navigation). The originally-requested URL is appended as ?returnUrl=. Adjust workspace/language/
# site per env. NB: this render-action fallback requires anonymous read on the target node, so it will NOT
# work on its own when guest is disabled — keep the connector config present so the direct path is used.
loginUrl=/cms/render/live/fr/sites/sofinco/home.connectToSofincoRedirectAction.do
