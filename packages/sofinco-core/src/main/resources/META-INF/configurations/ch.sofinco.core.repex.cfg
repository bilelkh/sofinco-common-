# default configuration
#
# ============================================================================
# Sofinco — Exemple représentatif - PID: ch.sofinco.core.repex
# ============================================================================
#
# Le marker "# default configuration" en première ligne empêche que les
# redéploiements du bundle écrasent les valeurs runtime modifiées par les
# ops via Provisioning API ou Tools Config Admin UI.
#
# Ce fichier ne fait que MATÉRIALISER les défauts déjà portés par l'annotation
# RepresentativeExampleConfig : sans lui, le service s'active exactement de la
# même façon, mais aucun objet de configuration n'existe et la console affiche
# le formulaire comme « non configuré ». Le poser rend le réglage visible et
# gérable par l'exploitation dès le premier déploiement.
#
# ============================================================================
# Ce que ces trois valeurs pilotent
# ============================================================================
#
# Le cache n'est consulté qu'au RENDU d'un fragment, pas à chaque visite : le
# cache de fragments de Jahia absorbe le trafic. Ces réglages ne concernent
# donc que la reprise après publication, purge ou déploiement.
#
# Ils n'ont AUCUN effet en mode mock ni hors du workspace `live` — ces deux
# chemins ne sont jamais mis en cache (conformité, et vérifiabilité en aperçu).
#
# ----------------------------------------------------------------------------
# Fenêtre de fraîcheur
# ----------------------------------------------------------------------------

# Durée pendant laquelle un résultat APIM est resservi sur le chemin nominal,
# aux pages partageant la même configuration de simulation.
#
#   0     désactive le dédoublonnage (chaque rendu rappelle l'APIM) ; le verrou
#         par configuration reste actif et effondre les rafales simultanées.
#   300    valeur de départ, à ajuster sur mesure.
#
# ⚠ Plafonnée par lastGoodTtlMinutes : une fenêtre supérieure au secours n'a pas
#   d'effet au-delà de celui-ci, et le service émet alors un WARN au démarrage.
#
# Avant de l'augmenter, MESURER — activer `ch.sofinco.core.metrics` en DEBUG et
# comparer les tags `source=cache` et `source=apim` de `repex.served`.
freshWindowSeconds=300

# ----------------------------------------------------------------------------
# Fenêtre de secours
# ----------------------------------------------------------------------------

# Durée pendant laquelle le dernier résultat VALIDE reste servable quand l'APIM
# échoue. L'exemple représentatif est une mention légale obligatoire : il ne doit
# pas disparaître de la page sur un incident transitoire.
#
# Doit rester nettement supérieure à freshWindowSeconds.
lastGoodTtlMinutes=30

# ----------------------------------------------------------------------------
# Plafond d'entrées
# ----------------------------------------------------------------------------

# Plafond de sécurité, en NOMBRE DE CONFIGURATIONS distinctes — pas de pages ni
# de visiteurs. Deux pages aux mêmes paramètres partagent une seule entrée.
#
# À relever seulement si /tools/cache.jsp montre le cache bloqué à ce plafond.
# Au-delà, ehcache évince la configuration la moins récemment utilisée.
maxEntries=256

# ============================================================================
# CAMPAGNE — bornes de l'offre (montants, durées, taux)
# ============================================================================
#
# Régime DISTINCT de celui de l'exemple représentatif ci-dessus, et c'est
# volontaire : une campagne ne dépend que de la PROVENANCE de la page, jamais du
# montant ni de la durée. Une seule entrée sert donc toutes les pages qui
# référencent la même provenance, et le catalogue en compte une poignée.

# ----------------------------------------------------------------------------
# Fenêtre de fraîcheur
# ----------------------------------------------------------------------------
#
# La borne haute n'est PAS le trafic — le cache absorbe déjà tout — mais le délai
# acceptable entre une correction de barème faite par le marketing via l'API et
# son apparition sur le site.
#
#   0     désactive le dédoublonnage ; le verrou par provenance reste actif.
#   1800  valeur de départ, soit 30 minutes.
campaignFreshWindowSeconds=1800

# ----------------------------------------------------------------------------
# Fenêtre de secours
# ----------------------------------------------------------------------------
#
# Durée pendant laquelle la dernière campagne VALIDE reste servable quand l'APIM
# échoue. Ces bornes figurent dans des mentions légales : mieux vaut une valeur
# de la veille qu'un jeton brut affiché au visiteur.
#
# Doit rester supérieure à la fenêtre de fraîcheur — sinon l'excédent est sans
# effet, et le service émet un WARN au démarrage.
campaignLastGoodTtlMinutes=240

# ----------------------------------------------------------------------------
# Plafond d'entrées
# ----------------------------------------------------------------------------
#
# En NOMBRE DE PROVENANCES distinctes. Bien plus bas que celui de l'exemple
# représentatif : la clé n'a qu'une seule composante.
campaignMaxEntries=64
