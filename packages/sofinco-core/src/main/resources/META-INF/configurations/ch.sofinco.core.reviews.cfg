# default configuration
#
# ============================================================================
# Sofinco — Avis Vérifiés - PID: ch.sofinco.core.reviews
# ============================================================================
#
# Le marker "# default configuration" en première ligne empêche que les
# redéploiements du bundle écrasent les valeurs runtime modifiées par les
# ops via Provisioning API ou Tools Config Admin UI.
#
# Ce fichier ne fait que MATÉRIALISER les défauts déjà portés par l'annotation
# ReviewCacheConfig : sans lui, le pont s'active exactement de la même façon,
# mais aucun objet de configuration n'existe et la console affiche le
# formulaire comme « non configuré ». Le poser rend le réglage visible et
# gérable par l'exploitation dès le premier déploiement.
#
# ============================================================================
# Ce que ces valeurs pilotent
# ============================================================================
#
# Le service d'avis est appelé en HTTP à chaque RENDU de fragment. Sur une page
# produit rendue à froid, cela fait cinq appels sortants :
#
#   getAverageRate  ×4  sticker du ProductHero, sticker du pied de page,
#                       JSON-LD AggregateRating, bloc sofnt:avisClient
#   fetchReviews    ×1  bloc sofnt:avisClient
#
# Le cache de fragments de Jahia absorbe le trafic nominal : ces réglages ne
# concernent donc que la reprise après publication, purge ou déploiement.
#
# Un « Vider tous les caches » rafraîchit immédiatement, quelle que soit la
# valeur — le cache vit dans un CacheManager ehcache, que Jahia purge et
# propage au cluster. Enregistrer ce fichier le vide aussi.
#
# ----------------------------------------------------------------------------
# Fraîcheur
# ----------------------------------------------------------------------------

# Durée pendant laquelle la note moyenne est resservie sans rappeler l'amont.
# La note bouge à l'échelle de l'année, le nombre d'avis à l'échelle du jour.
#
#   0     désactive la mémorisation ; le verrou par nœud de config reste actif
#         et effondre les rafales simultanées.
averageTtlSeconds=600

# Idem pour la liste des derniers avis du bloc sofnt:avisClient. Un avis publié
# met au plus cette durée à apparaître sur le site.
reviewsTtlSeconds=600

# ----------------------------------------------------------------------------
# Fenêtre d'échec
# ----------------------------------------------------------------------------

# Durée pendant laquelle un échec est mémorisé — amont injoignable, page de
# login du proxy corporate, données malformées.
#
# Doit rester NETTEMENT plus courte que la fraîcheur : elle arrête de marteler
# un amont mort sans retarder la reprise. 0 la désactive, et chaque rendu
# retentera l'appel pendant tout l'incident — exactement quand il ne faut pas.
failureTtlSeconds=60

# ----------------------------------------------------------------------------
# Plafond d'entrées
# ----------------------------------------------------------------------------

# Plafond de sécurité, en NOMBRE DE CLÉS distinctes — pas de pages ni de
# visiteurs. Un nœud de configuration par site pour la note ; pour les avis,
# un (produit, note minimale) par bloc sofnt:avisClient.
#
# À relever seulement si /tools/cache.jsp montre le cache bloqué à ce plafond.
maxEntries=256

# ----------------------------------------------------------------------------
# Timeouts HTTP
# ----------------------------------------------------------------------------

# Ces trois valeurs ne pilotent pas le cache — elles bornent l'appel lui-même.
# Elles sont ici parce qu'elles en sont indissociables : le pont appelle l'amont
# EN TENANT le verrou par clé. Sans borne d'attente, un amont qui accepte la
# connexion puis se tait bloque le thread gagnant indéfiniment, et tous les
# suivants derrière un `synchronized` non interruptible. Le sticker d'avis étant
# rendu sur toutes les pages du site, c'est le pool de threads de rendu qui se
# consomme, page par page, à mesure que les fragments de cache expirent.
#
# ATTENTION, sémantique INVERSE des fenêtres ci-dessus : là, 0 est un réglage
# valide qui désactive la mémorisation. Ici, 0 ne l'est pas — un appel sans
# borne est précisément ce qu'on supprime. Toute valeur <= 0 retombe sur le
# défaut porté par ReviewCacheConfig.
#
# Plus serrés que ceux de l'APIM (5/10/15, cf. ch.sofinco.core.apim.cfg) :
# l'APIM porte une simulation dont la page a besoin, le service d'avis une
# décoration dont l'absence se dégrade proprement (note manquante, JSON-LD
# AggregateRating omis).

# Établissement de la connexion TCP/TLS.
connectTimeoutSeconds=3

# Inactivité sur la socket une fois la connexion établie. C'est CELUI-CI qui
# transforme un amont muet en échec plutôt qu'en blocage.
socketTimeoutSeconds=5

# Attente de la réponse complète.
responseTimeoutSeconds=5
